services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: education
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d education"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${WRITER_DATABASE_URL:-postgresql+asyncpg://app_runtime:${APP_RUNTIME_PASSWORD:?APP_RUNTIME_PASSWORD must be set}@db:5432/education}
      WRITER_ADMISSION_ENABLED: ${WRITER_ADMISSION_ENABLED:-false}
      WRITER_GENERATION: ${WRITER_GENERATION:-}
      WRITER_INSTANCE_ID: ${WRITER_INSTANCE_ID:-}
      WRITER_DATABASE_ROLE: ${WRITER_DATABASE_ROLE:-app_runtime}
      REDIS_URL: redis://redis:6379/0
      EXPECTED_MIGRATION_HEAD: ${EXPECTED_MIGRATION_HEAD:?EXPECTED_MIGRATION_HEAD must be set}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    profiles: ["migration-gate"]
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/education
      EXPECTED_MIGRATION_HEAD: ${EXPECTED_MIGRATION_HEAD:?EXPECTED_MIGRATION_HEAD must be set}
      WRITER_GENERATION: ${WRITER_GENERATION:-}
      WRITER_DATABASE_ROLE: ${WRITER_DATABASE_ROLE:-}
      WRITER_ADMISSION_ENABLED: ${WRITER_ADMISSION_ENABLED:-false}
      GATE738P_ACTION: ${GATE738P_ACTION:-}
      GATE738P_CANDIDATE_HEALTH_URL: ${GATE738P_CANDIDATE_HEALTH_URL:-}
      GATE738P_HARD_CRASH_EVIDENCE_FILE: /run/migration-gate/qualification-evidence.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-B", "scripts/gate738p_contract_upgrade.py"]

volumes:
  postgres_data:
