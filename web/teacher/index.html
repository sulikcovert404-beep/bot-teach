<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تکالیف کلاس</title><link rel="stylesheet" href="/teacher-dashboard/styles.css"></head><body><main><header><h1>تکالیف کلاس</h1><span id="status" class="badge">در حال اتصال…</span></header><section id="notice" aria-live="polite"></section><section class="panel"><div class="toolbar"><button id="refresh">به‌روزرسانی</button><button id="create">تکلیف جدید</button></div><div id="classrooms" class="list" aria-label="کلاس‌های من"></div><div id="list" class="list"></div><div id="submissions" class="panel" hidden></div><div id="results" class="panel" aria-live="polite">نتایج آزمون پس از بارگذاری نمایش داده می‌شود.</div><div id="analytics" class="panel" aria-live="polite">تحلیل کلاس پس از بارگذاری نمایش داده می‌شود.</div><div id="reviewQueue" class="panel" aria-live="polite">صف بررسی محتوا پس از بارگذاری نمایش داده می‌شود.</div></section><dialog id="createDialog"><form method="dialog" id="form"><h2>ایجاد تکلیف</h2><label>شناسه کلاس<select name="classroom_id" id="classroomSelect" required></select></label><label>عنوان<input name="title" required maxlength="255"></label><label>دستورالعمل<textarea name="instructions"></textarea></label><menu><button value="cancel">انصراف</button><button value="default">ذخیره پیش‌نویس</button></menu></form></dialog></main><script src="/teacher-dashboard/app.js"></script></body></html>
