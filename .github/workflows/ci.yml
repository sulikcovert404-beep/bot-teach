name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: ci_migrations
          POSTGRES_PASSWORD: ci_only_ephemeral_migrations_password
          POSTGRES_DB: ai_teacher_migrations
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_migrations -d ai_teacher_migrations"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-linux-py312.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Enforce Ruff baseline (reject new findings only)
        env:
          RUFF_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ruff_baseline_gate.py
      - name: Enforce mypy baseline (reject new findings only)
        run: python scripts/mypy_baseline_gate.py
      - run: python -m pytest -q
      - name: Scan tracked files for credentials
        run: python scripts/secret_scan.py
      - name: Validate production configuration contract
        env:
          APP_ENV: production
          DATABASE_URL: sqlite+aiosqlite://
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-chars
          TELEGRAM_BOT_TOKEN: ci-only-telegram-token
          TELEGRAM_WEBHOOK_SECRET: ci-only-webhook-secret
          PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret
          GEMINI_API_KEY: ci-only-gemini-key
          REDIS_URL: redis://localhost:6379/0
        run: python -c "from app.core.config import Settings; Settings()"
      - name: Check disposable PostgreSQL capabilities
        env:
          DATABASE_URL: postgresql+asyncpg://ci_migrations:ci_only_ephemeral_migrations_password@127.0.0.1:5432/ai_teacher_migrations
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          async def main():
              connection = await asyncpg.connect(
                  os.environ["DATABASE_URL"].replace(
                      "postgresql+asyncpg://", "postgresql://", 1
                  )
              )
              try:
                  version = int(await connection.fetchval("SHOW server_version_num"))
                  if version // 10000 != 16:
                      raise SystemExit("EXPECTED_POSTGRESQL_MAJOR_16")

                  extensions = await connection.fetch(
                      "SELECT name, default_version "
                      "FROM pg_available_extensions WHERE name = 'vector'"
                  )
                  if len(extensions) != 1 or not extensions[0]["default_version"]:
                      raise SystemExit("PGVECTOR_EXTENSION_UNAVAILABLE")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Verify disposable app_runtime role prerequisite
        env:
          DATABASE_URL: postgresql+asyncpg://ci_migrations:ci_only_ephemeral_migrations_password@127.0.0.1:5432/ai_teacher_migrations
          CI_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: python -B tests/ci_bootstrap_app_runtime.py
      - name: Verify migration chain
        env:
          DATABASE_URL: postgresql+asyncpg://ci_migrations:ci_only_ephemeral_migrations_password@127.0.0.1:5432/ai_teacher_migrations
          EXPECTED_MIGRATION_HEAD: "20261004_0033"
        run: |
          python -m alembic upgrade "$EXPECTED_MIGRATION_HEAD"
          test "$(python -m alembic current 2>/dev/null | awk '{print $1}')" = "$EXPECTED_MIGRATION_HEAD"
      - name: Verify pgvector installed after migration
        env:
          DATABASE_URL: postgresql+asyncpg://ci_migrations:ci_only_ephemeral_migrations_password@127.0.0.1:5432/ai_teacher_migrations
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          async def main():
              connection = await asyncpg.connect(
                  os.environ["DATABASE_URL"].replace(
                      "postgresql+asyncpg://", "postgresql://", 1
                  )
              )
              try:
                  rows = await connection.fetch(
                      "SELECT extversion FROM pg_extension WHERE extname = 'vector'"
                  )
                  if len(rows) != 1 or not rows[0]["extversion"]:
                      raise SystemExit("PGVECTOR_EXTENSION_NOT_INSTALLED_AFTER_MIGRATION")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY
      - name: Verify migration rollback and re-upgrade
        env:
          DATABASE_URL: postgresql+asyncpg://ci_migrations:ci_only_ephemeral_migrations_password@127.0.0.1:5432/ai_teacher_migrations
          EXPECTED_MIGRATION_HEAD: "20261004_0033"
          ROLLBACK_MIGRATION_TARGET: "20261003_0031"
        run: |
          python -m alembic downgrade "$ROLLBACK_MIGRATION_TARGET"
          test "$(python -m alembic current 2>/dev/null | awk '{print $1}')" = "$ROLLBACK_MIGRATION_TARGET"
          python -m alembic upgrade "$EXPECTED_MIGRATION_HEAD"
          test "$(python -m alembic current 2>/dev/null | awk '{print $1}')" = "$EXPECTED_MIGRATION_HEAD"
      - name: Verify pgvector installed after re-upgrade
        env:
          DATABASE_URL: postgresql+asyncpg://ci_migrations:ci_only_ephemeral_migrations_password@127.0.0.1:5432/ai_teacher_migrations
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          async def main():
              connection = await asyncpg.connect(
                  os.environ["DATABASE_URL"].replace(
                      "postgresql+asyncpg://", "postgresql://", 1
                  )
              )
              try:
                  rows = await connection.fetch(
                      "SELECT extversion FROM pg_extension WHERE extname = 'vector'"
                  )
                  if len(rows) != 1 or not rows[0]["extversion"]:
                      raise SystemExit("PGVECTOR_EXTENSION_NOT_INSTALLED_AFTER_REUPGRADE")
              finally:
                  await connection.close()

          asyncio.run(main())
          PY

  docker:
    runs-on: ubuntu-latest
    needs: [quality, staging-smoke]
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Generate release provenance metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          payload = {
              "release_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "ci_run_id": os.environ["GITHUB_RUN_ID"],
              "builder": os.environ["GITHUB_ACTOR"],
              "timestamp": os.environ["GITHUB_RUN_STARTED_AT"] if "GITHUB_RUN_STARTED_AT" in os.environ else None,
              "artifact_reference": os.environ["IMAGE_REF"],
              "digest": os.environ["IMAGE_DIGEST"],
              "checksum": os.environ["IMAGE_DIGEST"],
              "platform": "linux/amd64",
              "attestation_reference": "pending-after-attestation",
          }
          with open("release-provenance.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
          PY
      - name: Attest image provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Upload release provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          path: release-provenance.json
          retention-days: 30

  staging-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret staging configuration
        run: |
          cp .env.example .env
          sed -i '/^EXPECTED_MIGRATION_HEAD=/d' .env
          echo "EXPECTED_MIGRATION_HEAD=20261003_0029" >> .env
      - name: Start disposable PostgreSQL and Redis
        run: docker compose up -d --build db redis
      - name: Run explicit pre-contract migration smoke
        # Exercises only allow-listed EXPAND_TARGET. It does not qualify 0033,
        # hard-crash behavior, Gate738L, or a production release.
        run: docker compose --profile migration-gate run --rm migrate
      - name: Start API after migration smoke succeeds
        run: docker compose up -d --build api
      - name: Wait for readiness and migration head
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if response=$(curl --silent --show-error --fail http://localhost:8000/health/ready); then
              echo "$response"
              test "$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "ready"
              test "$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["migration_head"])')" = "20261003_0029"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color migrate api
          exit 1
      - name: Verify PostgreSQL backup archive
        run: |
          docker compose exec -T db sh -c \
            'pg_dump --format=custom --file=/tmp/education.dump --dbname=education --username=postgres && pg_restore --list /tmp/education.dump'
      - name: Tear down staging stack
        if: always()
        run: docker compose down -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install --require-hashes -r requirements-linux-py312.lock
      - run: pip-audit -r requirements-linux-py312.lock --no-deps --disable-pip

  browser-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Ensure npm is available in pinned runner
        run: |
          if ! command -v npm >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends npm
          fi
      - name: Install Node dependencies (frozen)
        run: npm ci
      - name: Start disposable fixture server
        run: python3 tests/browser-e2e/fixtures/server.py >/tmp/browser-e2e-fixture.log 2>&1 &
      - name: Run disposable browser qualification
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e
      - name: Upload failure-only redacted traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-artifacts
          path: test-results/playwright/
          retention-days: 7
