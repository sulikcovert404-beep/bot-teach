name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check app tests migrations scripts
      - name: Mypy debt ratchet
        run: python scripts/check_mypy_baseline.py
      - run: python -m pytest -q
      - name: Scan tracked files for credentials
        run: python scripts/secret_scan.py
      - name: Validate production configuration contract
        env:
          APP_ENV: production
          DATABASE_URL: sqlite+aiosqlite://
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-chars
          TELEGRAM_BOT_TOKEN: ci-only-telegram-token
          TELEGRAM_WEBHOOK_SECRET: ci-only-webhook-secret
          PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret
          GEMINI_API_KEY: ci-only-gemini-key
          REDIS_URL: redis://localhost:6379/0
        run: python -c "from app.core.config import Settings; Settings()"
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: education
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d education"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Upgrade disposable PostgreSQL to canonical head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/education
          EXPECTED_MIGRATION_HEAD: 20260921_0022
        run: |
          python -m alembic upgrade head
          test "$(python -m alembic current 2>/dev/null | awk '{print $1}')" = "$EXPECTED_MIGRATION_HEAD"
      - name: Qualify concurrent provisioning on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/education
        run: |
          for run in $(seq 1 10); do
            pytest -q tests/test_test_identity_provisioning.py -k postgres_concurrent_same_key_has_created_and_replay
          done

  postgres-migration-chain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: education
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d education"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Qualify canonical PostgreSQL migration chain
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/education
          EXPECTED_MIGRATION_HEAD: 20260921_0022
        run: |
          set -euo pipefail
          python -m alembic upgrade head
          test "$(python -m alembic current 2>/dev/null | awk '{print $1}')" = "$EXPECTED_MIGRATION_HEAD"
          test "$(python -m alembic heads 2>/dev/null | awk '{print $1}')" = "$EXPECTED_MIGRATION_HEAD"
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def verify():
              conn = await asyncpg.connect(os.environ["DATABASE_URL"].replace("+asyncpg", ""))
              try:
                  assert await conn.fetchval("SELECT 1 FROM pg_extension WHERE extname = 'vector'"), "pgvector extension missing"
                  rows = await conn.fetch("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('provisioning_idempotency_keys', 'exam_attempts', 'exams')")
                  assert {row["table_name"] for row in rows} == {"provisioning_idempotency_keys", "exam_attempts", "exams"}
              finally:
                  await conn.close()

          asyncio.run(verify())
          PY
          python -m alembic downgrade 20260912_0021
          python -m alembic upgrade head
          test "$(python -m alembic current 2>/dev/null | awk '{print $1}')" = "$EXPECTED_MIGRATION_HEAD"

  docker:
    runs-on: ubuntu-latest
    needs: [quality, postgres-migration-chain]
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=target,annotation-index.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Generate release provenance metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          payload = {
              "release_id": os.environ["GITHUB_RUN_ID"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "ci_run_id": os.environ["GITHUB_RUN_ID"],
              "builder": os.environ["GITHUB_ACTOR"],
              "timestamp": os.environ["GITHUB_RUN_STARTED_AT"] if "GITHUB_RUN_STARTED_AT" in os.environ else None,
              "artifact_reference": os.environ["IMAGE_REF"],
              "digest": os.environ["IMAGE_DIGEST"],
              "checksum": os.environ["IMAGE_DIGEST"],
              "platform": "linux/amd64",
              "attestation_reference": "pending-after-attestation",
          }
          with open("release-provenance.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
          PY
      - name: Attest image provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Upload release provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          path: release-provenance.json
          retention-days: 30

  staging-smoke:
    runs-on: ubuntu-latest
    needs: [quality, postgres-migration-chain]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret staging configuration
        run: |
          cp .env.example .env
          # Disposable-only credentials; never used by staging or production.
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=postgres/' .env
          sed -i 's/^APP_RUNTIME_PASSWORD=.*/APP_RUNTIME_PASSWORD=app-runtime-ci-only/' .env
          sed -i 's/^EXPECTED_MIGRATION_HEAD=.*/EXPECTED_MIGRATION_HEAD=20260921_0022/' .env
      - name: Start disposable database and cache
        run: docker compose up -d --build db redis
      - name: Provision disposable app runtime role
        run: |
          set -euo pipefail
          until docker compose exec -T db pg_isready -U postgres -d education >/dev/null 2>&1; do
            sleep 2
          done
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d education \
            -c "DO \$\$ BEGIN
                  IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_runtime') THEN
                    CREATE ROLE app_runtime LOGIN PASSWORD 'app-runtime-ci-only'
                      NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
                  END IF;
                END \$\$;"
      - name: Run canonical migrations as postgres
        run: docker compose up -d --build migrate
      - name: Grant disposable runtime privileges
        run: |
          set -euo pipefail
          until [ "$(docker compose ps --status exited --services | grep -c '^migrate$' || true)" = "1" ]; do
            sleep 2
          done
          docker compose exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d education <<'SQL'
          GRANT CONNECT ON DATABASE education TO app_runtime;
          GRANT USAGE ON SCHEMA public TO app_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_runtime;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO app_runtime;
          SQL
      - name: Verify disposable runtime role boundaries
        run: |
          docker compose exec -T db psql -At -U postgres -d education -c \
            "SELECT rolname, rolsuper, rolcreatedb, rolcreaterole, rolbypassrls,
                    pg_has_role('app_runtime', 'postgres', 'member'),
                    has_database_privilege('app_runtime', 'education', 'CREATE'),
                    has_schema_privilege('app_runtime', 'public', 'CREATE'),
                    (SELECT pg_get_userbyid(datdba) <> 'app_runtime'
                       FROM pg_database WHERE datname = 'education'),
                    (SELECT nspowner <> (SELECT oid FROM pg_roles WHERE rolname = 'app_runtime')
                       FROM pg_namespace WHERE nspname = 'public')
             FROM pg_roles WHERE rolname = 'app_runtime';"
      - name: Start API with least-privilege runtime role
        run: docker compose up -d --build api
      - name: Wait for readiness and migration head
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if response=$(curl --silent --show-error --fail http://localhost:8000/health/ready); then
              echo "$response"
              test "$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "ready"
              test "$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["migration_head"])')" = "20260921_0022"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color migrate api
          exit 1
      - name: Verify PostgreSQL backup archive
        run: |
          docker compose exec -T db sh -c \
            'pg_dump --format=custom --file=/tmp/education.dump --dbname=education --username=postgres && pg_restore --list /tmp/education.dump'
      - name: Tear down staging stack
        if: always()
        run: docker compose down -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install .
      - run: pip-audit

  browser-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Ensure npm is available in pinned runner
        run: |
          if ! command -v npm >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends npm
          fi
      - name: Install Node dependencies (frozen)
        run: npm ci
      - name: Start disposable fixture server
        run: python3 tests/browser-e2e/fixtures/server.py >/tmp/browser-e2e-fixture.log 2>&1 &
      - name: Run disposable browser qualification
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e
      - name: Upload failure-only redacted traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-artifacts
          path: test-results/playwright/
          retention-days: 7
