name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check app tests migrations scripts
      - run: python -m mypy app
      - run: python -m pytest -q
      - name: Scan tracked files for credentials
        run: python scripts/secret_scan.py
      - name: Validate production configuration contract
        env:
          APP_ENV: production
          DATABASE_URL: sqlite+aiosqlite://
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-chars
          TELEGRAM_BOT_TOKEN: ci-only-telegram-token
          TELEGRAM_WEBHOOK_SECRET: ci-only-webhook-secret
          PAYMENT_WEBHOOK_SECRET: ci-only-payment-secret
          GEMINI_API_KEY: ci-only-gemini-key
          REDIS_URL: redis://localhost:6379/0
        run: python -c "from app.core.config import Settings; Settings()"
      - name: Verify migration chain
        env:
          DATABASE_URL: sqlite:///ci-migrations.sqlite
          EXPECTED_MIGRATION_HEAD: 20260912_0021
        run: |
          python -m alembic upgrade "$EXPECTED_MIGRATION_HEAD"
          test "$(python -m alembic current 2>/dev/null | awk '{print $1}')" = "$EXPECTED_MIGRATION_HEAD"
      - name: Verify migration rollback and re-upgrade
        env:
          DATABASE_URL: sqlite:///ci-migrations.sqlite
          EXPECTED_MIGRATION_HEAD: 20260912_0021
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade "$EXPECTED_MIGRATION_HEAD"
          test "$(python -m alembic current 2>/dev/null | awk '{print $1}')" = "$EXPECTED_MIGRATION_HEAD"

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-education-platform-iran:ci

  staging-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret staging configuration
        run: |
          cp .env.example .env
          echo "EXPECTED_MIGRATION_HEAD=20260912_0021" >> .env
      - name: Start staging stack
        run: docker compose up -d --build db redis migrate api
      - name: Wait for readiness and migration head
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if response=$(curl --silent --show-error --fail http://localhost:8000/health/ready); then
              echo "$response"
              test "$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "ready"
              test "$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["migration_head"])')" = "20260912_0021"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color migrate api
          exit 1
      - name: Verify PostgreSQL backup archive
        run: |
          docker compose exec -T db sh -c \
            'pg_dump --format=custom --file=/tmp/education.dump --dbname=education --username=postgres && pg_restore --list /tmp/education.dump'
      - name: Tear down staging stack
        if: always()
        run: docker compose down -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install .
      - run: pip-audit

  browser-e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install Node dependencies (frozen)
        run: npm ci
      - name: Start disposable fixture server
        run: python3 tests/browser-e2e/fixtures/server.py >/tmp/browser-e2e-fixture.log 2>&1 &
      - name: Run disposable browser qualification
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e
      - name: Upload failure-only redacted traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-artifacts
          path: test-results/playwright/
          retention-days: 7
