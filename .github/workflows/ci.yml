name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check app tests
      - run: python -m mypy app
      - run: python -m pytest -q
      - name: Verify migration chain
        env:
          DATABASE_URL: sqlite:///ci-migrations.sqlite
        run: python -m alembic upgrade head
      - name: Verify migration rollback and re-upgrade
        env:
          DATABASE_URL: sqlite:///ci-migrations.sqlite
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-education-platform-iran:ci

  staging-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret staging configuration
        run: cp .env.example .env
      - name: Start staging stack
        run: docker compose up -d --build db redis migrate api
      - name: Wait for readiness and migration head
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if response=$(curl --silent --show-error --fail http://localhost:8000/health/ready); then
              echo "$response"
              test "$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "ready"
              test "$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["migration_head"])')" = "d1e2f3a4b5c6"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color migrate api
          exit 1
      - name: Verify PostgreSQL backup archive
        run: |
          docker compose exec -T db sh -c \
            'pg_dump --format=custom --file=/tmp/education.dump --dbname=postgresql://postgres:postgres@localhost:5432/education && pg_restore --list /tmp/education.dump'
      - name: Tear down staging stack
        if: always()
        run: docker compose down -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install .
      - run: pip-audit
